<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>BloonsTD</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Letterbox the game canvas: keep its aspect ratio
           (MAP_WIDTH+SIDEBAR+MENU vs MAP_HEIGHT, see Settings.h),
           fill whichever viewport dimension is the binding constraint. */
        #canvas {
            display: block;
            background: #000;
            outline: none;
            aspect-ratio: 1086 / 511;
            width: 100vw;
            max-height: 100vh;
            max-width: calc(100vh * 1086 / 511);
            image-rendering: pixelated;
        }
        /* Welcome overlay covering the canvas until the user taps Play. Two
           reasons it has to exist:
             1. iOS Safari (and the Google iOS app, which uses WKWebView and
                is bound by the same rule) won't let an AudioContext start
                without a direct user gesture, so SDL2_mixer's context stays
                suspended forever and no audio plays.
             2. iOS Safari throttles requestAnimationFrame on a fresh page
                until first interaction, so the canvas just stays black.
           One tap on the Play button satisfies both. */
        #welcome {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            z-index: 10;
            text-align: center;
            padding: 16px;
            /* Default content-box sizing would make the rendered width
               100vw + 32px (padding on both sides) and trigger a stray
               horizontal scrollbar. */
            box-sizing: border-box;
        }
        /* Inline Share icon — drawn instead of using a unicode glyph
           because most fonts don't ship the iOS Share codepoint, so it
           falls back to weird boxes/triangles. */
        .share-icon {
            display: inline-block;
            vertical-align: -3px;
            width: 16px;
            height: 16px;
        }
        #welcome h1 {
            font-size: 40px;
            margin: 0 0 12px;
            letter-spacing: 2px;
        }
        #welcome p {
            font-size: 16px;
            opacity: 0.7;
            margin: 0 0 32px;
            max-width: 26em;
        }
        #play-btn {
            font: inherit;
            font-size: 22px;
            padding: 14px 40px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            border-radius: 999px;
            cursor: pointer;
            -webkit-appearance: none;
            transition: background 0.15s;
        }
        #play-btn:not(:disabled):hover,
        #play-btn:not(:disabled):active {
            background: rgba(255, 255, 255, 0.12);
        }
        #play-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        #welcome.hidden { display: none; }
        /* iPhone-only Add-to-Home-Screen tip. iPhone Safari refuses to
           expose Fullscreen API on anything but <video>, and a "Click to
           Play" tap can't fix that — the URL bar and home indicator will
           always squeeze the letterboxed canvas. The escape hatch is the
           Add-to-Home-Screen flow, which honours apple-mobile-web-app-capable
           and launches the page chrome-less. iPad and Android Chrome have
           working requestFullscreen, so they don't need this. */
        #ios-tip {
            margin-top: 28px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.45;
            opacity: 0.85;
            max-width: 22em;
        }
        #ios-tip strong { font-weight: 600; }
        #ios-tip ol {
            text-align: left;
            margin: 8px 0 0;
            padding-left: 20px;
        }
        #ios-tip[hidden] { display: none; }
    </style>
</head>
<body>
<div id="welcome">
    <h1>BloonsTD</h1>
    <p>Place towers, pop bloons, survive the waves.</p>
    <button id="play-btn" type="button" disabled>Loading&hellip;</button>
    <div id="ios-tip" hidden>
        <strong>For fullscreen on iPhone</strong>
        <ol>
            <li>Tap the Share icon
                <svg class="share-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M12 3v12"/>
                    <path d="M7 8l5-5 5 5"/>
                    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
                </svg>
                in Safari</li>
            <li>Choose <em>Add to Home Screen</em></li>
            <li>Launch the game from the new home-screen icon</li>
        </ol>
    </div>
</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
    var welcome = document.getElementById('welcome');
    var playBtn = document.getElementById('play-btn');

    // SDL2's Emscripten audio driver exposes its AudioContext as a
    // global JS var: SDL2.audio.context (the global is created by an
    // EM_ASM block inside SDL_emscriptenaudio.c, so it lives on window,
    // not on Module). On iOS WebKit it's born suspended; we resume it
    // synchronously inside the Play click handler.
    function unlockAllAudio() {
        try {
            var ctx = (typeof SDL2 !== 'undefined' && SDL2.audio && SDL2.audio.context);
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            // Some iOS revisions need an actual sample to flush the
            // audio graph before SFX become audible — a 1-frame silent
            // buffer does the trick without making any noise.
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
        } catch (e) {}
    }

    // Hand the runtime our canvas and silence the default on-page logger
    // (Emscripten's stock shell pipes stdout to a <textarea>; we don't
    // want it). onRuntimeInitialized fires after SDL_Init has run inside
    // main(), so by that point SDL_mixer has constructed its AudioContext
    // (suspended on iOS) and the Play button can be enabled.
    var Module = {
        canvas: document.getElementById('canvas'),
        print:    (...args) => console.log(...args),
        printErr: (...args) => console.warn(...args),
        onRuntimeInitialized: function () {
            playBtn.disabled = false;
            playBtn.textContent = 'Click to Play';
        },
    };

    // Touch input has no hover and a coarse pointer; desktop has at least
    // one of hover or fine pointer. Used to gate fullscreen so it only
    // kicks in for iPad/phone, not laptop browsers.
    function isTouchDevice() {
        return matchMedia('(hover: none) and (pointer: coarse)').matches;
    }

    // iPhone (not iPad) detection. iPadOS 13+ reports Mac in the UA, so
    // matching just iPhone/iPod here keeps iPad out — iPad Safari already
    // supports requestFullscreen on arbitrary elements and doesn't need
    // the Add-to-Home-Screen flow. Skip the tip if already launched from
    // the home screen (navigator.standalone is the iOS-specific flag).
    function isIPhoneSafari() {
        return /iPhone|iPod/.test(navigator.userAgent)
            && !window.navigator.standalone;
    }
    if (isIPhoneSafari()) {
        document.getElementById('ios-tip').hidden = false;
    }

    playBtn.addEventListener('click', function () {
        welcome.classList.add('hidden');

        // Synchronous, inside the user-gesture window — iOS WebKit refuses
        // resume() / requestFullscreen() outside it.
        unlockAllAudio();

        // Touch devices only: enter fullscreen so Safari's URL bar and the
        // home indicator stop squishing the letterboxed canvas. iPad Safari
        // and Android Chrome implement the Fullscreen API on arbitrary
        // elements; iPhone Safari only allows it on <video> so the call
        // either no-ops or throws — caught and ignored. iPhone users get
        // the best experience by adding the page to the home screen
        // (apple-mobile-web-app-capable meta tag handles that).
        if (isTouchDevice()) {
            var el = document.documentElement;
            var req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (req) {
                try { req.call(el); } catch (e) {}
            }
        }

        document.getElementById('canvas').focus();
    });
</script>
{{{ SCRIPT }}}
</body>
</html>
