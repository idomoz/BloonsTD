name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # required by the `release` job to publish a GitHub Release

jobs:
  macos:
    name: macOS (arm64) standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake sdl2 sdl2_image sdl2_ttf sdl2_gfx boost dylibbundler

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Package as .app bundle
        env:
          APP: dist/BloonsTD.app
        run: |
          set -e
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/lib" "$APP/Contents/assets"
          cp build/BloonsTD "$APP/Contents/MacOS/BloonsTD-bin"
          cp -R assets/.    "$APP/Contents/assets/"

          # Launcher: cd's into MacOS/ so the binary's "../assets/" paths
          # resolve to Contents/assets/ regardless of how it was invoked
          # (Finder, `open`, terminal).
          cat > "$APP/Contents/MacOS/BloonsTD" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          exec ./BloonsTD-bin "$@"
          EOF
          chmod +x "$APP/Contents/MacOS/BloonsTD"

          # Bundle every non-system dylib into Contents/lib/.
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/BloonsTD-bin" \
            -d "$APP/Contents/lib" \
            -p '@executable_path/../lib/'

          # Minimal Info.plist
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>BloonsTD</string>
              <key>CFBundleDisplayName</key><string>BloonsTD</string>
              <key>CFBundleIdentifier</key><string>com.idomoz.bloonstd</string>
              <key>CFBundleVersion</key><string>1.0.${{ github.run_number }}</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleExecutable</key><string>BloonsTD</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Re-sign the whole bundle ad-hoc since we modified its contents.
          codesign --force --deep --sign - "$APP"

      - name: Zip with ditto (preserves perms, signatures, xattrs)
        run: |
          ditto -c -k --keepParent dist/BloonsTD.app dist/BloonsTD-macos-arm64.zip
          ls -lh dist/BloonsTD-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloonsTD-macos-arm64
          path: dist/BloonsTD-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows (MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_gfx
            mingw-w64-x86_64-boost
            zip

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Package release tree (exe + runtime DLLs + assets)
        run: |
          set -e
          mkdir -p dist/BloonsTD/bin
          cp build/BloonsTD.exe dist/BloonsTD/bin/
          cp -R assets dist/BloonsTD/assets

          # Recursively copy every MinGW64 DLL the binary (and its DLL deps)
          # need into bin/, so the artifact is self-contained.
          cd dist/BloonsTD/bin
          while :; do
            before=$(find . -maxdepth 1 -iname '*.dll' | wc -l)
            for exe in *.exe *.dll; do
              [ -e "$exe" ] || continue
              # ldd may fail on some files; tolerate that.
              deps=$(ldd "$exe" 2>/dev/null | awk '/=> \/mingw64/ {print $3}' || true)
              for dep in $deps; do
                cp -n "$dep" . 2>/dev/null || true
              done
            done
            after=$(find . -maxdepth 1 -iname '*.dll' | wc -l)
            if [ "$before" -eq "$after" ]; then
              break
            fi
          done

          echo "Bundled DLLs:"
          ls *.dll | sort

      - name: Add top-level launcher
        run: |
          set -e
          # Double-click launcher at the root of the bundle. CRLF line endings
          # so cmd.exe parses it correctly. `cd /d %~dp0bin` makes the cwd
          # bin/, which is what the binary expects (assets are at ../assets/).
          printf '@echo off\r\ncd /d "%%~dp0bin"\r\nstart "" "BloonsTD.exe"\r\n' \
            > dist/BloonsTD/BloonsTD.bat

      - name: Zip release tree
        run: |
          set -e
          (cd dist && zip -ry BloonsTD-windows-x64.zip BloonsTD)
          ls -lh dist/BloonsTD-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloonsTD-windows-x64
          path: dist/BloonsTD-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # Only release on push to master, never on PRs or manual reruns from forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: BloonsTD-macos-arm64
          path: .

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: BloonsTD-windows-x64
          path: .

      - name: List zips
        run: ls -lh *.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit `${{ github.sha }}`.

            * **macOS (arm64)** — `BloonsTD-macos-arm64.zip`. Unzip and
              double-click `BloonsTD.app` (or drag it to Applications).
              Self-contained: all SDL2 / Boost dylibs are bundled.
              First-run may need `xattr -dr com.apple.quarantine BloonsTD.app`
              because the bundle is ad-hoc signed (not notarized).
            * **Windows (x64)** — `BloonsTD-windows-x64.zip`. MinGW build with
              all required DLLs bundled in `bin/`. Double-click `BloonsTD.bat`
              at the top level to launch (or run `bin\BloonsTD.exe` directly).
          files: |
            BloonsTD-macos-arm64.zip
            BloonsTD-windows-x64.zip
          prerelease: true
          make_latest: true
