name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # required by the `release` job to publish a GitHub Release

jobs:
  macos:
    name: macOS (arm64) standalone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake sdl2 sdl2_image sdl2_ttf sdl2_gfx boost dylibbundler

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Package standalone bundle
        run: |
          mkdir -p dist/BloonsTD/bin dist/BloonsTD/lib
          cp build/BloonsTD dist/BloonsTD/bin/
          cp -R assets      dist/BloonsTD/assets
          cd dist/BloonsTD
          dylibbundler -od -b -x bin/BloonsTD -d lib -p '@executable_path/../lib/'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloonsTD-macos-arm64
          path: dist/BloonsTD
          if-no-files-found: error

  windows:
    name: Windows (MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_gfx
            mingw-w64-x86_64-boost

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j

      - name: Package release tree (exe + runtime DLLs + assets)
        run: |
          set -e
          mkdir -p dist/BloonsTD/bin
          cp build/BloonsTD.exe dist/BloonsTD/bin/
          cp -R assets dist/BloonsTD/assets

          # Recursively copy every MinGW64 DLL the binary (and its DLL deps)
          # need into bin/, so the artifact is self-contained.
          cd dist/BloonsTD/bin
          while :; do
            before=$(find . -maxdepth 1 -iname '*.dll' | wc -l)
            for exe in *.exe *.dll; do
              [ -e "$exe" ] || continue
              # ldd may fail on some files; tolerate that.
              deps=$(ldd "$exe" 2>/dev/null | awk '/=> \/mingw64/ {print $3}' || true)
              for dep in $deps; do
                cp -n "$dep" . 2>/dev/null || true
              done
            done
            after=$(find . -maxdepth 1 -iname '*.dll' | wc -l)
            if [ "$before" -eq "$after" ]; then
              break
            fi
          done

          echo "Bundled DLLs:"
          ls *.dll | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloonsTD-windows-x64
          path: dist/BloonsTD
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # Only release on push to master, never on PRs or manual reruns from forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BloonsTD-macos-arm64
          path: macos/BloonsTD

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BloonsTD-windows-x64
          path: windows/BloonsTD

      - name: Zip bundles
        run: |
          set -e
          (cd macos   && zip -ry ../BloonsTD-macos-arm64.zip BloonsTD)
          (cd windows && zip -ry ../BloonsTD-windows-x64.zip BloonsTD)
          ls -lh *.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit `${{ github.sha }}`.

            * **macOS (arm64)** — `BloonsTD-macos-arm64.zip`. Self-contained
              bundle (`dylibbundler`), runs on any Apple Silicon Mac.
              Launch: `cd BloonsTD/bin && ./BloonsTD`.
              First run may need `xattr -dr com.apple.quarantine BloonsTD/`.
            * **Windows (x64)** — `BloonsTD-windows-x64.zip`. MinGW build with
              all required DLLs bundled in `bin/`. Launch: `bin\BloonsTD.exe`.
          files: |
            BloonsTD-macos-arm64.zip
            BloonsTD-windows-x64.zip
          prerelease: true
          make_latest: true
